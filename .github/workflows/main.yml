name: Build TVBoxOS Debug APK
on:
  workflow_dispatch: # 支持网页手动点击触发
  push:
    branches: [ main ] # push到main分支自动编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传APK作为产物Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
