name: Build TVBoxOS Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ubuntu runner自带SDK，直接写local.properties，不再调用setup-android
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传APK作为产物Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
